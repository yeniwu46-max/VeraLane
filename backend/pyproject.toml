[project]
name = "veralane-api"
version = "0.1.0"
description = "VeraLane local banking-agent demo API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

