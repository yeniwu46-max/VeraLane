# Keep the Basic Auth password file outside the repository.
server {
    listen 80;
    server_name demo.wuyeni.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/veralane-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name demo.wuyeni.cn;

    ssl_certificate /etc/letsencrypt/live/veralane-demo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veralane-demo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    auth_basic "VeraLane private demo";
    auth_basic_user_file /etc/nginx/.veralane-demo.htpasswd;

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1:8000;
        proxy_set_header Origin http://127.0.0.1:8000;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
